# Codex Proxy RS 应用配置模板。
#
# 使用：
#   sudo install -m 0640 -o "$(id -u)" -g 10001 deploy/config.example.yaml deploy/config.yaml
#
# PostgreSQL 与 Redis 密码分别执行 `openssl rand -hex 24` 生成；管理员初始密码单独设置。

schema_version: 1

host:
  # 统一展示、查询日期、限额重置和定时任务的 IANA 时区，修改后重启生效。
  timezone: 'Asia/Shanghai'
  listen:
    # 本地 cargo run 使用；Docker 内由 CPR_SERVER_HOST/PORT 覆盖。
    host: '127.0.0.1'
    port: 8080
  # OpenAI 会话身份、系统更新状态和备份暂存区的统一根目录。
  # 相对路径以 deploy/config.yaml 所在目录为基准。
  runtime_data_dir: '../.runtime/data'
  logging:
    level: 'info'
    stdout: true
    # 将原始 AT/RT 写入独立 OAuth 恢复文件，沿用 file 的目录、大小与保留期。
    oauth_recovery: false
    # 将完整请求与响应头、正文写入独立文件；包含凭据，仅排障时开启。
    request_dump: false
    # 按实际时长保留，支持正小数天数，例如 0.5 为 12 小时
    request_dump_retention_days: 1
    file:
      enabled: true
      # 相对路径以 deploy/config.yaml 所在目录为基准。
      directory: '../.runtime/logs'
      retention_days: 7
      max_file_size_mb: 20
  # 二进制部署需要管理端自重启时，取消以下注释；可选路径改为实际程序绝对路径。
  # Compose 已通过环境变量开启，保持本段注释即可；详情见 deploy/README.md。
  # system_update:
  #   deployment_mode: 'binary'
  #   self_restart_enabled: true
  #   executable_path: '/opt/codex-proxy-rs/codex-proxy-rs' # 可选：覆盖启动时解析的程序路径。
  worker_shutdown_timeout_seconds: 30

store:
  database:
    # Docker 内由 CPR_DATABASE_URL 覆盖；密码不要写进 URL。
    url: 'postgres://codex_proxy@127.0.0.1:5432/codex_proxy'
    # 16–128 字节，不能全为空白或含控制字符，并满足服务端密码策略
    password: &postgres_password ''
  redis:
    # Docker 内由 CPR_REDIS_URL 覆盖；密码不要写进 URL。
    # ACL 用户写在 URL 中，例如 redis://u1@redis-host:6379/0；配置步骤见 deploy/README.md。
    url: 'redis://127.0.0.1:6379/'
    # 与 PostgreSQL 共用密码格式要求，并满足 Redis 服务端密码策略
    password: &redis_password ''
  # 可选：PostgreSQL 连接池预算；下列值与当前推荐默认一致。
  # 小内存低并发部署的池上限与数据库调优见 deploy/README.md#小内存优化
  # pool:
  #   max_connections: 20
  #   acquire_timeout_seconds: 5
  #   observability_timeout_seconds: 120 # 观测操作保护时限，不是性能目标

admin:
  # 不活动期限与从登录起计算的最长有效期，单位为分钟
  session_ttl_minutes: 10080
  session_absolute_ttl_minutes: 43200
  default_username: 'admin@cpr.local'
  # 仅首次创建管理员时使用；至少 12 个字符且不能包含 `$`。
  default_password: ''

client:
  # 统一登录中密钥身份的固定会话有效期。
  session_ttl_minutes: 1440

api:
  # Docker 内由 CPR_WEB_DIST_DIR 覆盖。
  asset_directory: '../frontend/dist'
  cors_allowed_origins: []
  request_timeout_seconds: null
  request_id_header: 'x-request-id'

openai:
  # 以下两项原样发送配置值；省略或设为 null 时删除对应请求头
  # 数据驻留参考值：us
  residency: us
  # 账号路由参考值：us、us_cr
  account_routing_override: null
  # 模型不支持冷却，单位秒，0 表示不写入且忽略已有模型级冷却；范围 0-86400
  model_unsupported_cooldown_seconds: 1800
  # 原生 Responses 参数兼容；独立开关，不需要请求兼容插件，不映射推理档位
  # request_compatibility:
  #   lite_context: false
  #   store_false: false # 仅选中的 OAuth 账号；不改变 API Key 的存储意图
  #   json_object: false
  #   min_output_tokens_16: false # 路由前修正 gpt-/codex- 请求的小整数输出预算
  #   tool_structure: false # 修复嵌套 function 结构；非法名称返回 400，不删除工具
  # 可选：无实质输出时有界补发，与握手恢复互斥，默认关闭
  # ws_response_recovery:
  #   enabled: false
  #   max_retries: 1 # 首次请求以外的补发次数，0-5；0 关闭断流补发
  #   full_history: false # 续接失败时只重放宿主摘要确认的完整历史
  #   encrypted_history: false # 明确拒绝的密文定点清理一次，并记忆摘要 30 分钟
  #   encrypted_history_max_sessions: 65536 # 1-65536；仅拒绝过密文的范围占用缓存
  #   encrypted_history_max_digests_per_session: 512 # 1-512；无额外全局摘要上限
  #   window_ms: 5000 # 1-10000
  #   max_prefix_bytes: 65536 # 1024-262144
  #   close_codes: [1000, 1011, 1012] # 允许 1000/1001/1011/1012/1013
  #   disconnects: true # 无关闭握手、TCP reset/aborted、broken pipe、unexpected EOF
  # 可选：仅 OAuth 空正文 WS 握手 403 的请求内恢复，默认关闭
  # ws_opening_recovery:
  #   enabled: false
  #   max_retries: 2 # 首次握手以外的次数，0-5
  #   retry_delay_ms: 200 # 50-5000，Retry-After 优先
  #   http_fallback: true # 仅原版允许 HTTP 的请求，最多一次
  # 可选：完整的 Responses 上游 WS 池配置；省略整段使用以下默认值。
  # ws_pool:
  #   enabled: true
  #   max_age_ms: 3300000
  #   max_connecting: 8
  #   idle_timeout_ms: 300000 # 仅回收未绑定活跃客户端 WS 的空闲连接，必须大于零。
  #   stream_idle_timeout_ms: 300000

# 可选：插件宿主启动配置，修改后重启，省略保持既有容量与绑定行为
# plugins:
#   rpc:
#     maximum_calls: 512 # 默认 256，上限 1024
#     maximum_executing_calls: 64
#     maximum_queued_calls: 64
#     maximum_callbacks: 1024 # 默认 320，上限 4096
#     queue_timeout_ms: 30000
#   http_filters:
#     'a0f1ee31-0005-8e2a-bfd9-30e7de51c321': # 替换为实际插件实例 ID
#       - { method: POST, path: /v1/responses }
#       - { method: POST, path: /responses }

# Compose 启动桥接区；密码仍只维护在 store 中。
services:
  app-runtime:
    environment:
      # 默认空值；小内存机器可改为下列值，更积极回收空闲内存，但可能增加 CPU 开销。
      # 'glibc.malloc.mmap_threshold=131072:glibc.malloc.trim_threshold=131072'
      # 由 Compose 在进程启动前传入，修改后需重建应用容器，详见 deploy/README.md#小内存优化。
      GLIBC_TUNABLES: ''

  postgres-credentials:
    environment:
      POSTGRES_PASSWORD: *postgres_password

  redis-credentials:
    # 可选的持久化与内存预算见 deploy/README.md#小内存优化，调整时保留密码参数
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - *redis_password
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --no-auth-warning
        - -a
        - *redis_password
        - ping
